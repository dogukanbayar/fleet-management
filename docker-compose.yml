services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    environment:
      POSTGRES_DB: fleetdb
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet123
    ports:
      - "5432:5432"
    volumes:
      - fleet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleetdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: fleet-app
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fleetdb
      DB_USERNAME: fleet
      DB_PASSWORD: fleet123
    ports:
      - "8080:8080"

volumes:
  fleet-pgdata: