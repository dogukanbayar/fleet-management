spring:
  application:
    name: fleet-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleetdb}
    username: ${DB_USERNAME:fleet}
    password: ${DB_PASSWORD:fleet123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 8080

fleet:
  maintenance:
    default-interval-km: 10000
    default-interval-days: 180

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs