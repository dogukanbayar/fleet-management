spring:
  application:
    name: fleet-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleetdb}
    username: ${DB_USERNAME:fleet}
    password: ${DB_PASSWORD:fleet123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 8080

fleet:
  maintenance:
    default-interval-km: 10000
    default-interval-days: 180

# Loglama: LOG_LEVEL ortam değişkeniyle değiştirilebilir (TRACE|DEBUG|INFO|WARN|ERROR). Varsayılan INFO.
logging:
  level:
    root: ${LOG_LEVEL:INFO}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.filo.fleet: ${LOG_LEVEL:INFO}
    org.springframework.web: ${SPRING_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
